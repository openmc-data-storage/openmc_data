
name: test_convert_scripts
on:
  workflow_dispatch:
    inputs:
      script:
        description: Script recipe to run (downloads and processes large datasets)
        required: true
        type: choice
        options:
          - convert_fendl
          - convert_jeff32
          - convert_jeff33
          - convert_endf
          - convert_tendl
          - convert_tendl_rand
          - download_endf
          - download_tendl
          - download_chain
          - add_branching_ratios
          - reduce_chain


jobs:
    run_scripts:
      runs-on: ubuntu-latest
      timeout-minutes: 360
      steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.12

      - name: Install testing dependencies
        run: |
          sudo apt-get update
          sudo apt-get install libhdf5-serial-dev
          git clone --single-branch --branch develop --depth 1 https://github.com/openmc-dev/openmc.git
          cd openmc
          mkdir build
          cd build
          cmake ..
          make -j2
          sudo make -j2 install
          cd ..
          pip install .
          cd ..
          pip install .

      # Convert scripts that require MCNP nuclear data are not tested because
      # the CI doesn't contain that nuclear data.
      # convert_lib80x.py convert_mcnp70.py convert_mcnp71.py files are not tested here

      - name: test default convert_fendl
        if: inputs.script == 'convert_fendl'
        run: |
          convert_fendl --cleanup

      # this running convert_jeff32 in with default arguments produces 49GB of
      # data. Hence the use of arguments to process just one temperature
      - name: test default convert_jeff32
        if: inputs.script == 'convert_jeff32'
        run: |
          convert_jeff32 -r 3.2 -t 293 --cleanup

      - name: test default convert_jeff33
        if: inputs.script == 'convert_jeff33'
        run: |
          convert_jeff33 -r 3.3 -t 293 --cleanup

      - name: test default convert_endf
        if: inputs.script == 'convert_endf'
        run: |
          convert_endf --cleanup

      - name: test default convert_tendl
        if: inputs.script == 'convert_tendl'
        run: |
          convert_tendl --cleanup

      - name: test default convert_tendl_rand
        if: inputs.script == 'convert_tendl_rand'
        run: |
          convert_tendl_rand --nuclides O16 --cleanup

      # download scripts
      - name: test default download_endf
        if: inputs.script == 'download_endf'
        run: |
          download_endf

      - name: test default download_tendl
        if: inputs.script == 'download_tendl'
        run: |
          download_tendl -r 2019
          download_tendl -r 2021

      - name: test default download_chain
        if: inputs.script == 'download_chain'
        run: |
          download_chain -l endf -r b7.1 -b None
          download_chain -l endf -r b8.0 -b None
          download_chain -l endf -r b7.1 -b SFR
          download_chain -l endf -r b8.0 -b SFR
          download_chain -l endf -r b7.1 -b PWR
          download_chain -l endf -r b8.0 -b PWR
          download_chain -l endf -r b8.0 -b PWR

      - name: test default add_branching_ratios
        if: inputs.script == 'add_branching_ratios'
        run: |
          download_chain -l endf -r b8.0
          add_branching_ratios -i chain-endf-b8.0.xml -o chain_endf_b8.0_sfr.xml -b sfr
          add_branching_ratios -i chain-endf-b8.0.xml -o chain_endf_b8.0_pwr.xml -b pwr

      - name: test default reduce_chain
        if: inputs.script == 'reduce_chain'
        run: |
          download_chain -l endf -r b8.0
          reduce_chain -i chain-endf-b8.0.xml -o chain_endf_b8.0_sfr.xml -hl 1e15

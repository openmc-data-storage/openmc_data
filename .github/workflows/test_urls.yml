
name: test_urls
on:  
  workflow_dispatch:
  pull_request:    
    branches:
      - main
    paths-ignore:
      - "**.md"
      - "**.txt"
      - "**.cff"
      - 'docs/**'
      - '.gitignore'  
  push:
    branches:
    - main
  schedule:
    - cron: "0 0 * * *"
# cron job runs every day

jobs:
    ping_urls:
      runs-on: ubuntu-latest
      steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.12

      - name: Install testing dependencies
        run: python -m pip install '.[tests]'

      - name: Test URL registry and HTTP helpers offline
        run: python -m pytest -q -rs tests/test_urls.py -m 'not network and not integration'

    live_urls:
      if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
      runs-on: ubuntu-latest
      timeout-minutes: 180
      steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.12

      - name: Install testing dependencies
        run: python -m pip install '.[tests]'

      # External failures remain failures; this health check is not a PR gate.
      - name: Test live URLs with explicit skip reasons
        run: python -m pytest -v -rs tests/test_urls.py -m network
